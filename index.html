/* ===== 升級三選一：質感版（取代舊的整圈閃爍）：一層柔和的呼吸光暈 + 偶爾掃過的高光 + 各張節奏不同 ===== */
#lvdlg .card{position:relative;z-index:0;overflow:visible;--c:255,215,94;background:linear-gradient(165deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 38%),linear-gradient(0deg,rgba(var(--c),.16),rgba(var(--c),0) 55%),rgba(16,11,5,.93);box-shadow:0 0 0 1px rgba(255,255,255,.10) inset,0 3px 10px rgba(0,0,0,.7),0 0 14px rgba(var(--c),.45);animation:lvBreath 1.6s ease-in-out infinite}
#lvdlg .card.t-white{--c:236,240,255}#lvdlg .card.t-green{--c:95,224,122}#lvdlg .card.t-blue{--c:90,169,255}#lvdlg .card.t-gold{--c:255,206,80}#lvdlg .card.t-purple{--c:195,123,255}#lvdlg .card.t-red{--c:255,90,90}#lvdlg .card.t-cyan{--c:79,232,232}
#lvdlg .card.t-white,#lvdlg .card.t-green,#lvdlg .card.t-blue,#lvdlg .card.t-gold,#lvdlg .card.t-purple,#lvdlg .card.t-red,#lvdlg .card.t-cyan{animation-name:lvBreath;animation-duration:1.6s;animation-direction:normal;animation-timing-function:ease-in-out}   /* 蓋掉舊的各階閃爍動畫：持續發光，慢慢亮、慢慢暗，一個來回約 1.6 秒（高階稍快） */
#lvdlg .card.t-blue,#lvdlg .card.t-gold{animation-duration:1.4s}
#lvdlg .card.t-purple,#lvdlg .card.t-red,#lvdlg .card.t-cyan{animation-duration:1.2s}
#lvdlg .card::before{content:"";position:absolute;inset:-34px;z-index:-1;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--c),.85),rgba(var(--c),.32) 55%,rgba(var(--c),0) 100%);filter:blur(5px);animation:lvAura 1.6s ease-in-out infinite}
#lvdlg .card.t-blue::before,#lvdlg .card.t-gold::before{animation-duration:1.4s}
#lvdlg .card.t-purple::before,#lvdlg .card.t-red::before,#lvdlg .card.t-cyan::before{animation-duration:1.2s;inset:-40px}
#lvdlg .card::after{content:none}
#lvdlg .card:nth-child(n),#lvdlg .card:nth-child(n)::before{animation-delay:-.8s}   /* 全部同步；負的延遲＝一出現就從「最亮」開始，馬上看到光 */
#lvdlg .card.t-blue:nth-child(n),#lvdlg .card.t-blue:nth-child(n)::before,#lvdlg .card.t-gold:nth-child(n),#lvdlg .card.t-gold:nth-child(n)::before{animation-delay:-.7s}
#lvdlg .card.t-purple:nth-child(n),#lvdlg .card.t-purple:nth-child(n)::before,#lvdlg .card.t-red:nth-child(n),#lvdlg .card.t-red:nth-child(n)::before,#lvdlg .card.t-cyan:nth-child(n),#lvdlg .card.t-cyan:nth-child(n)::before{animation-delay:-.6s}
#lvdlg .card:hover{border-color:#fff;transform:scale(1.15)}
#lvdlg .card:hover::before{inset:-44px;filter:blur(6px) brightness(1.4)}
@keyframes lvBreath{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 3px 10px rgba(0,0,0,.7),0 0 6px rgba(var(--c),.25)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.28) inset,0 3px 10px rgba(0,0,0,.7),0 0 26px 3px rgba(var(--c),.95)}}
@keyframes lvAura{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
